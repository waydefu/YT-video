name: Anatomy explainer deck (official assets, structure, static stills, Morph proxy)
on:
  pull_request:
    paths:
      - 'scripts/anatomy_assets.py'
      - 'scripts/anatomy_capture.mjs'
      - 'scripts/build_anatomy_explainer.py'
      - 'scripts/pptx_world.py'
      - 'scripts/pptx_morph_proxy.py'
      - 'scripts/pptx_validate.py'
      - 'scripts/pptx_morph_patch.py'
      - 'tests/test_pptx_*.py'
      - 'docs/ANATOMY-EXPLAINER.md'
      - '.github/workflows/anatomy-explainer.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install Python packages
        run: python -m pip install --disable-pip-version-check "python-pptx==1.0.2" "Pillow==11.3.0"
      - name: Unit tests (layer A)
        run: python -m unittest discover -s tests -v
      - name: Install system tools, fonts and the page-capture browser
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            libreoffice-impress poppler-utils fonts-noto-cjk fonts-dejavu-core >/dev/null
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Fetch OFFICIAL Anatomy material from the pinned commit (SHA256-checked) and prepare it
        run: python scripts/anatomy_assets.py --out build/anatomy/assets
      - name: Build the 13-slide deck
        run: python scripts/build_anatomy_explainer.py --output build/anatomy/anatomy-explainer.pptx
      - name: Validate structure (layer A only; not PowerPoint playback)
        run: |
          python scripts/pptx_validate.py build/anatomy/anatomy-explainer.pptx --min-loops 0 --strict \
            --readable build/anatomy/anatomy-explainer.readable.json
      - name: Build Morph geometry proxy (can reject a design, never prove playback)
        run: python scripts/pptx_morph_proxy.py build/anatomy/anatomy-explainer.pptx build/anatomy/proxy.pptx --steps 3
      - name: Render static stills and proxy frames (layer B)
        run: |
          set -euo pipefail
          mkdir -p build/anatomy/stills build/anatomy/proxy
          timeout 300s libreoffice -env:UserInstallation=file:///tmp/lo-anatomy-ci --headless --convert-to pdf \
            --outdir build/anatomy/stills build/anatomy/anatomy-explainer.pptx
          timeout 600s libreoffice -env:UserInstallation=file:///tmp/lo-anatomy-ci --headless --convert-to pdf \
            --outdir build/anatomy/proxy build/anatomy/proxy.pptx
          pdftoppm -r 60 -png build/anatomy/stills/anatomy-explainer.pdf build/anatomy/stills/frame
          pdftoppm -r 36 -png build/anatomy/proxy/proxy.pdf build/anatomy/proxy/frame
          test "$(ls build/anatomy/stills/frame-*.png | wc -l)" -eq 13
          test "$(ls build/anatomy/proxy/frame-*.png | wc -l)" -eq 49
          echo "STATIC + PROXY QA only. PowerPoint playback, video export and phone viewing are NOT verified."
      - name: Upload deck, provenance and visual evidence (no upstream raw files)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: anatomy-explainer
          path: |
            build/anatomy/anatomy-explainer.pptx
            build/anatomy/anatomy-explainer.readable.json
            build/anatomy/assets/manifest.json
            build/anatomy/assets/LICENSE_ANATOMY.txt
            build/anatomy/stills/frame-*.png
            build/anatomy/proxy/frame-*.png
          retention-days: 14
          if-no-files-found: error
