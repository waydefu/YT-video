name: Governance baseline (docs + policy, NOT artistic approval)

# Deliberately no paths filter: one baseline check for EVERY PR.
# Branch protection must be configured separately by a repository admin.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: governance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-and-policy:
    name: governance / docs-and-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Compile Python source
        run: python3 -m compileall -q blender scripts tests
      - name: Validate documentation references and active workflow contract
        run: |
          python3 -m unittest discover -s tests -p 'test_docs_links.py' -v
          python3 -m unittest discover -s tests -p 'test_governance_policy.py' -v
      - name: Explain evidence boundaries
        run: |
          echo 'PASS means syntax, documentation links and policy invariants only.'
          echo 'It does NOT validate PPT Morph playback, Blender output, aesthetics or device compatibility.'
