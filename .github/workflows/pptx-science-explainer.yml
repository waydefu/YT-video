name: PPTX science-explainer spike (structure + static stills + Morph proxy)
on:
  pull_request:
    paths:
      - 'scripts/build_science_explainer.py'
      - 'scripts/pptx_morph_proxy.py'
      - 'scripts/pptx_validate.py'
      - 'scripts/pptx_morph_patch.py'
      - 'scripts/pptx_motion.py'
      - 'tests/test_pptx_*.py'
      - 'docs/PPTX-SEAMLESS-EXPLAINER.md'
      - '.github/workflows/pptx-science-explainer.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install Python packages
        run: python -m pip install --disable-pip-version-check "python-pptx==1.0.2"
      - name: Unit tests (layer A)
        run: python -m unittest discover -s tests -v
      - name: Build science-explainer spike
        run: python scripts/build_science_explainer.py --output build/science-explainer/science-explainer-spike.pptx
      - name: Validate structure (layer A only; not PowerPoint playback)
        run: |
          python scripts/pptx_validate.py build/science-explainer/science-explainer-spike.pptx \
            --min-loops 3 --hold-ms 4800 --strict \
            --readable build/science-explainer/science-explainer-spike.readable.json
      - name: Build Morph geometry proxy (can reject a design, never prove playback)
        run: python scripts/pptx_morph_proxy.py build/science-explainer/science-explainer-spike.pptx build/science-explainer/proxy.pptx --steps 3
      - name: Render static stills and proxy frames (layer B)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            libreoffice-impress poppler-utils fonts-noto-cjk >/dev/null
          mkdir -p build/science-explainer/stills build/science-explainer/proxy
          timeout 240s libreoffice -env:UserInstallation=file:///tmp/lo-sci-ci --headless --convert-to pdf \
            --outdir build/science-explainer/stills build/science-explainer/science-explainer-spike.pptx
          timeout 240s libreoffice -env:UserInstallation=file:///tmp/lo-sci-ci --headless --convert-to pdf \
            --outdir build/science-explainer/proxy build/science-explainer/proxy.pptx
          pdftoppm -r 60 -png build/science-explainer/stills/science-explainer-spike.pdf build/science-explainer/stills/frame
          pdftoppm -r 40 -png build/science-explainer/proxy/proxy.pdf build/science-explainer/proxy/frame
          test "$(ls build/science-explainer/stills/frame-*.png | wc -l)" -eq 4
          test "$(ls build/science-explainer/proxy/frame-*.png | wc -l)" -eq 13
          echo "STATIC + PROXY QA only. PowerPoint playback and video export are NOT verified."
      - name: Upload deck, specs, stills and proxy frames
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: science-explainer-spike
          path: |
            build/science-explainer/science-explainer-spike.pptx
            build/science-explainer/*.json
            build/science-explainer/stills/frame-*.png
            build/science-explainer/proxy/frame-*.png
          retention-days: 14
          if-no-files-found: error
