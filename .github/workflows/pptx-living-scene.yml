name: PPTX living-scene spike (structure + static stills)
on:
  pull_request:
    paths:
      - 'scripts/pptx_motion.py'
      - 'scripts/pptx_validate.py'
      - 'scripts/pptx_morph_patch.py'
      - 'scripts/build_living_scene.py'
      - 'tests/test_pptx_*.py'
      - 'docs/PPTX-LIVE-MOTION.md'
      - '.github/workflows/pptx-living-scene.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install Python packages
        run: python -m pip install --disable-pip-version-check "python-pptx==1.0.2"
      - name: Unit tests (layer A)
        run: python -m unittest discover -s tests -v
      - name: Build original-vector living-scene spike
        run: python scripts/build_living_scene.py --output build/living-scene/living-scene-spike.pptx
      - name: Validate structure (layer A only; not PowerPoint playback)
        run: python scripts/pptx_validate.py build/living-scene/living-scene-spike.pptx --min-loops 3 --strict
      - name: Render static stills (layer B; NOT a Morph or animation playback test)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            libreoffice-impress poppler-utils fonts-noto-cjk >/dev/null
          mkdir -p build/living-scene/stills
          timeout 180s libreoffice -env:UserInstallation=file:///tmp/lo-living-ci \
            --headless --convert-to pdf --outdir build/living-scene/stills \
            build/living-scene/living-scene-spike.pptx
          pdftoppm -r 80 -png build/living-scene/stills/living-scene-spike.pdf \
            build/living-scene/stills/frame
          test "$(ls build/living-scene/stills/frame-*.png | wc -l)" -eq 3
          echo "STATIC QA: 3 stills rendered. Motion, Morph and loops are NOT verified here."
      - name: Upload deck, motion spec and stills
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: living-scene-spike
          path: |
            build/living-scene/living-scene-spike.pptx
            build/living-scene/living-scene-spike.motion.json
            build/living-scene/stills/frame-*.png
          retention-days: 14
          if-no-files-found: error
