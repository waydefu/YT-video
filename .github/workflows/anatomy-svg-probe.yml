name: Anatomy SVG high-resolution figure research
on:
  pull_request:
    paths:
      - scripts/anatomy_svg_probe.py
      - .github/workflows/anatomy-svg-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install Chromium automation
        run: |
          python -m pip install --disable-pip-version-check "playwright==1.55.0"
          python -m playwright install --with-deps chromium
      - name: Download upstream authored figure HTML
        env:
          UPSTREAM: 1482e8469b0a9e0d8cc18ea2740a01423d29ae80
        run: |
          mkdir -p build/anatomy-svg
          curl -fL --retry 3 --connect-timeout 15 --max-time 120 \
            "https://raw.githubusercontent.com/wheresryan22/anatomy/$UPSTREAM/examples/raptor-engine/raptor-engine-light.html" \
            -o build/anatomy-svg/upstream.html
          test "$(wc -c < build/anatomy-svg/upstream.html)" -ge 1000000
          python scripts/anatomy_svg_probe.py --html build/anatomy-svg/upstream.html --out build/anatomy-svg/art
      - name: Preserve rendered official source and DOM report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: anatomy-svg-source-research
          path: |
            build/anatomy-svg/art/**
          retention-days: 7
          if-no-files-found: error
